services:
  postgres:
    image: postgres:16-alpine
    container_name: financeapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeapp
      POSTGRES_PASSWORD: financeapp_dev
      POSTGRES_DB: financeapp
    ports:
      - "5432:5432"
    volumes:
      - financeapp_pgdata:/var/lib/postgresql/data

volumes:
  financeapp_pgdata:
